<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>帳號 · Foxframe</title>
		<link rel="stylesheet" href="lab.css" />
		<script src="lab.js" defer></script>
	</head>
	<body>
		<header>
			<nav class="wrap" aria-label="網站導覽">
				<a class="wordmark" href="gallery.html">Foxframe</a>
				<a href="gallery.html">相簿</a>
				<a aria-current="page" href="index.html">帳號</a>
				<a href="login.html">登入</a>
			</nav>
		</header>
		<main class="wrap account">
			<section aria-labelledby="account-title">
				<h1 id="account-title">示範帳號</h1>
				<dl>
					<div>
						<dt>帳號</dt>
						<dd>fox-student</dd>
					</div>
					<div>
						<dt>課程</dt>
						<dd>wifi-security</dd>
					</div>
				</dl>
				<button id="compare" type="button" aria-controls="results" aria-expanded="false">比較 HTTP 與 TLS</button>
				<p id="status" role="status"></p>
			</section>
			<section id="results" aria-labelledby="results-title" hidden>
				<h2 id="results-title">傳輸內容</h2>
				<h3>
					HTTP
					<span id="http-state"></span>
				</h3>
				<pre id="plain"></pre>
				<h3>
					TLS
					<span id="tls-state"></span>
				</h3>
				<pre id="encrypted"></pre>
				<p id="verification"></p>
			</section>
		</main>
	</body>
</html>
