<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>相簿 · Foxframe</title>
		<link rel="stylesheet" href="lab.css" />
		<script src="lab.js" defer></script>
	</head>
	<body>
		<header>
			<nav class="wrap" aria-label="網站導覽">
				<a class="wordmark" href="gallery.html">Foxframe</a>
				<a aria-current="page" href="gallery.html">相簿</a>
				<a href="index.html">帳號</a>
				<a href="login.html">登入</a>
			</nav>
		</header>
		<main class="wrap">
			<div class="toolbar">
				<h1>阿波羅 11 號</h1>
				<div class="actions">
					<button type="button" id="pick" class="secondary">選擇替換圖</button>
					<input id="replacement" type="file" accept="image/png,image/jpeg,image/webp" hidden />
					<button type="button" id="toggle" aria-controls="gallery">模擬替換</button>
				</div>
			</div>
			<p id="status" role="status"></p>
			<div class="gallery" id="gallery">
				<figure>
					<img src="images/one.jpg" alt="奧德林穿著太空衣站在月球表面" />
					<figcaption>月面上的奧德林</figcaption>
				</figure>
				<figure>
					<img src="images/two.jpg" alt="月球土壤上的太空靴鞋印" />
					<figcaption>月面腳印</figcaption>
				</figure>
				<figure>
					<img src="images/three.jpg" alt="登月艙飛離月球表面，地球出現在遠處" />
					<figcaption>登月艙返航</figcaption>
				</figure>
			</div>
			<p class="credit">原圖：NASA</p>
		</main>
	</body>
</html>
